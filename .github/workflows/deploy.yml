name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Pixous to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 34.192.33.171
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GROQ_API_KEY,OPENAI_API_KEY,GEMINI_API_KEY
          timeout: 600s
          command_timeout: 15m
          script: |
            set -e
            echo "== git update =="
            cd /srv/pixous
            git fetch origin
            git reset --hard origin/main

            echo "== backend deps =="
            cd /srv/pixous/backend
            venv/bin/pip install -r requirements.txt -q

            echo "== configure AI provider keys (update-or-append, never touches other keys) =="
            touch .env
            for key in GROQ_API_KEY OPENAI_API_KEY GEMINI_API_KEY; do
              val=$(eval echo \$$key)
              if [ -n "$val" ]; then
                grep -v "^${key}=" .env > .env.tmp || true
                mv .env.tmp .env
                printf '%s=%s\n' "$key" "$val" >> .env
              fi
            done

            echo "== frontend build =="
            cd /srv/pixous/frontend
            npm ci --no-audit --no-fund
            VITE_API_URL=http://34.192.33.171 npm run build

            echo "== restart service =="
            sudo systemctl restart pixous
            echo "== health check (retry up to 90s) =="
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:9090/health >/dev/null; then
                echo "HEALTH OK"
                echo "DEPLOY OK"
                exit 0
              fi
              sleep 3
            done
            echo "HEALTH CHECK FAILED"
            exit 1
