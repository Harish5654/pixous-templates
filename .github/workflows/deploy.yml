name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Pixous to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 34.192.33.171
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_HOST_KEY }}
          timeout: 600s
          command_timeout: 15m
          script: |
            set -e
            echo "== git update =="
            cd /srv/pixous
            git fetch origin
            git reset --hard origin/main

            echo "== backend deps =="
            cd /srv/pixous/backend
            venv/bin/pip install -r requirements.txt -q

            echo "== frontend build =="
            cd /srv/pixous/frontend
            npm ci --no-audit --no-fund
            VITE_API_URL=http://34.192.33.171 npm run build

            echo "== restart service =="
            sudo systemctl restart pixous
            sleep 4
            echo "== health check =="
            curl -sf http://127.0.0.1:9090/health || exit 1
            echo "DEPLOY OK"
